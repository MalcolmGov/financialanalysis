name: Deploy portal

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-portal
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy portal
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN GitHub secret is not set; skip auto-deploy."
            echo "Until it is, run: railway up --service portal --ci"
            exit 0
          fi
          railway up --service portal --ci
