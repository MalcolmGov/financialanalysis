[project]
name = "results-studio-worker"
version = "0.1.0"
description = "Docling extraction + design-DNA probe + render/QA service for Results Studio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "pypdfium2>=4.30",
    "pikepdf>=9.0",
    "pdfplumber>=0.11",
    "fonttools>=4.55",
    "pillow>=11.0",
    # Docling is the extraction engine; heavy (pulls torch). Imported lazily so
    # the API and unit tests run without it installed.
    "docling>=2.15",
    # Declared directly (docling only pulls them transitively) so the
    # [tool.uv.sources] CPU-only index override below actually applies — uv
    # silently ignores a source override for a package that never appears as
    # a direct dependency. Without a direct torchvision pin, the lock resolves
    # it from PyPI (CUDA-flavoured) against CPU torch and AutoImageProcessor
    # fails at runtime with a misleading import error.
    "torch>=2.2.2,<3.0.0",
    "torchvision>=0.17,<1.0.0",
    "transformers>=4.46,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "datamodel-code-generator>=0.26",
]

[tool.uv]
# Allow running the API + tests without the heavy docling/torch stack.
# `uv sync --no-install-package docling` for a light dev env.

[tool.uv.sources]
# Deployment (Railway, CPU-only) must not resolve the default CUDA-bundled
# torch wheel on Linux (pulls the full CUDA toolkit — cublas/cudnn/cufft/etc,
# multiple GB, useless without a GPU). Pin torch (and its CUDA-only extra,
# torchvision) to PyTorch's official CPU-only index on every platform.
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
